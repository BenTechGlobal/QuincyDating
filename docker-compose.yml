services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: quincy
      POSTGRES_PASSWORD: quincy
      POSTGRES_DB: quincy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quincy"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata: